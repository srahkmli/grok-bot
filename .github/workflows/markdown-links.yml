name: Markdown links

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  link-check:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject links aimed at a master branch
        run: |
          if grep -RInE 'https?://[^ )]*((blob|tree)/master|refs/heads/master)' --include='*.md' .; then
            echo "Link to the main branch. This repository has no master branch."
            exit 1
          fi

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          lycheeVersion: v0.24.2
          args: >-
            --verbose
            --no-progress
            --include-fragments
            --max-retries 3
            --timeout 20
            "./**/*.md"
